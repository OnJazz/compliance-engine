name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Create RSA private key
        run: |
          mkdir -p src/main/resources/certs
          printf '%s\n' '${{ secrets.JWT_PRIVATE_KEY }}' > src/main/resources/certs/private.pem

      - name: Build and test
        run: ./mvnw clean verify

      - name: SonarCloud analysis
        run: ./mvnw sonar:sonar -Dsonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Wait for SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          CE_TASK_ID=$(grep '^ceTaskId=' target/sonar/report-task.txt | cut -d'=' -f2)

          echo "Waiting for SonarCloud analysis: $CE_TASK_ID"

          for i in {1..60}; do
            RESPONSE=$(curl -sS \
              -u "$SONAR_TOKEN:" \
              "https://sonarcloud.io/api/ce/task?id=$CE_TASK_ID")

            STATUS=$(echo "$RESPONSE" | jq -r '.task.status')

            echo "Analysis status: $STATUS"

            if [ "$STATUS" = "SUCCESS" ]; then
              echo "SonarCloud analysis completed successfully."
              break
            fi

            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "SonarCloud analysis failed."
              echo "$RESPONSE"
              exit 1
            fi

            sleep 5
          done

          if [ "$STATUS" != "SUCCESS" ]; then
            echo "Timeout waiting for SonarCloud analysis."
            exit 1
          fi

      - name: Check SonarCloud Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ANALYSIS_ID=$(curl -sS \
            -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/ce/task?id=$(grep '^ceTaskId=' target/sonar/report-task.txt | cut -d'=' -f2)" \
            | jq -r '.task.analysisId')

          echo "Analysis ID: $ANALYSIS_ID"

          RESPONSE=$(curl -sS \
            -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/qualitygates/project_status?analysisId=$ANALYSIS_ID")

          STATUS=$(echo "$RESPONSE" | jq -r '.projectStatus.status')

          echo "SonarCloud Quality Gate: $STATUS"

          if [ "$STATUS" != "OK" ]; then
            echo "Quality Gate failed."
            echo "$RESPONSE"
            exit 1
          fi

          echo "Quality Gate passed."