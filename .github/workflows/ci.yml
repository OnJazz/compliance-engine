name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Create RSA private key
        run: |
          mkdir -p src/main/resources/certs
          printf '%s\n' '${{ secrets.JWT_PRIVATE_KEY }}' > src/main/resources/certs/private.pem

      - name: Build and test
        run: ./mvnw clean verify

      - name: SonarCloud analysis
        run: ./mvnw sonar:sonar -Dsonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Check Sonar task
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "=== report-task.txt ==="
          cat target/sonar/report-task.txt

          echo "=== Compute Engine task ==="
          CE_TASK_ID=$(grep '^ceTaskId=' target/sonar/report-task.txt | cut -d'=' -f2)

          curl -sS \
            -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/ce/task?id=$CE_TASK_ID"